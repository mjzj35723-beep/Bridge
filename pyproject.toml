[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bridge-steering"
version = "0.1.0"
description = "BRIDGE early branch supervision and native likelihood pullback steering"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "torch>=2.1",
  "transformers>=4.45",
  "datasets>=2.18",
  "huggingface_hub>=0.24",
  "tqdm>=4.66",
]

[tool.setuptools.packages.find]
where = ["src"]
